<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="違規回報" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="manifest" href="/manifest.webmanifest?v=20260801a" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <title>{{ title }} · 違規車牌回報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=20260801a" />
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="md-app">
    <header class="md-top-app-bar">
      <div class="md-top-app-bar__row">
        <span class="material-symbols-outlined md-top-app-bar__icon" aria-hidden="true">directions_car</span>
        <h1 class="md-top-app-bar__title">{{ title }}</h1>
        <button type="button" class="md-icon-btn" id="btnInstall" hidden title="安裝到主畫面">
          <span class="material-symbols-outlined">install_mobile</span>
        </button>
      </div>
    </header>

    <main class="md-content">
      {% block content %}{% endblock %}
    </main>

    <nav class="md-bottom-nav" aria-label="主要導覽">
      <a href="/" class="md-bottom-nav__item {% if request.url.path == '/' %}is-active{% endif %}">
        <span class="material-symbols-outlined">photo_camera</span>
        <span class="md-bottom-nav__label">回報</span>
      </a>
      <a href="/admin" class="md-bottom-nav__item {% if request.url.path == '/admin' %}is-active{% endif %}">
        <span class="material-symbols-outlined">map</span>
        <span class="md-bottom-nav__label">紀錄</span>
      </a>
    </nav>
  </div>

  <div class="md-snackbar" id="snackbar" hidden>
    <span id="snackbarText"></span>
  </div>

  <script src="/static/app.js?v=20260801a" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
